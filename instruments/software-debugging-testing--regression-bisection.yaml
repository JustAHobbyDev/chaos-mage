extraction:
  id: SOFTWARE-REGRESSION-BISECTION-001
  name: Regression bisection
  practice: Software debugging and testing
  source: >
    Git documentation, "git-bisect";
    https://git-scm.com/docs/git-bisect
  status: accepted
  ambiguities:
    - field: state
      issue: >
        Efficient binary elimination assumes a testable transition across an
        ordered revision history. Flaky behavior or multiple appearance and
        disappearance events weaken that structure.
      alternatives:
        - "Single transition between known old/new endpoints"
        - "Ordered history with a property that can be repeatedly classified"
  extraction_failures: []
  notes: >
    Proposed schema relevance: none. This tests eliminative inference with an
    explicit iterative stopping mechanism.

instrument:
  state: >
    An ordered sequence of revisions contains a transition in a reproducibly
    testable property, with at least one earlier state known not to have the
    property and one later state known to have it.

  operation: >
    Test an intermediate revision, use the result to discard the incompatible
    portion of the remaining history, and repeat the partition-and-test process
    until the transition is localized.

  signal: >
    Each tested revision is classified on one side or the other of the target
    property, progressively shrinking the interval that can contain the
    transition.

  inference: >
    Repeated elimination constrains the first revision associated with the
    observed change to the final unresolved boundary or commit.

  limit: >
    Flaky tests, unbuildable revisions, nonmonotonic behavior, multiple
    independent changes, interactions among revisions, or an incorrectly chosen
    good or bad endpoint can prevent unique localization or identify a boundary
    that is correlated with rather than solely causal of the behavior.
