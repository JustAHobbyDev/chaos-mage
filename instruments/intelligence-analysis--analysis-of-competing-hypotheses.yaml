extraction:
  id: INTELLIGENCE-ACH-001
  name: Analysis of Competing Hypotheses
  practice: Intelligence analysis
  source: >
    Richards J. Heuer Jr., Psychology of Intelligence Analysis, Center for the
    Study of Intelligence, CIA (1999);
    https://www.cia.gov/resources/csi/books-monographs/psychology-of-intelligence-analysis-2/
  status: accepted
  ambiguities:
    - field: signal
      issue: >
        The method emphasizes inconsistency and diagnosticity rather than raw
        accumulation of supporting evidence. Its signal is therefore the
        comparative pattern of consistency and inconsistency across hypotheses.
      alternatives:
        - "Evidence-by-hypothesis inconsistency pattern"
        - "Relative diagnosticity of evidence across alternatives"
  extraction_failures: []
  notes: >
    Proposed schema relevance: none. This is a primary test of eliminative
    inference using a relational rather than physical signal.

instrument:
  state: >
    Several plausible explanations can account for an uncertain situation, and
    available evidence may fit more than one of them.

  operation: >
    State the competing explanations explicitly, evaluate each item of evidence
    against all of them, emphasize evidence that is inconsistent with
    particular explanations, and test the sensitivity of the resulting
    comparison to uncertain evidence or assumptions.

  signal: >
    The evidence forms a comparative pattern of consistency and inconsistency
    across the competing explanations, with some items discriminating among
    them more strongly than others.

  inference: >
    Explanations with greater important inconsistency can be weakened or
    eliminated, leaving a smaller set of alternatives that better survives the
    observed evidence.

  limit: >
    Missing hypotheses, dependent or unreliable evidence, subjective
    consistency judgments, poor assessment of diagnosticity, and shared
    assumptions can make the comparison misleading. Surviving contradiction is
    not proof that the remaining explanation is true.
