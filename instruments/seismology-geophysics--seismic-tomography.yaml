extraction:
  id: SEISMOLOGY-SEISMIC-TOMOGRAPHY-001
  name: Seismic tomography
  practice: Seismology and geophysics
  source: >
    U.S. Geological Survey, "Seismic tomography 2023";
    https://pubs.usgs.gov/publication/70273820
    EarthScope Consortium, "Seismic Tomography";
    https://www.earthscope.org/what-is/seismology/seismic-tomography/
  status: accepted
  ambiguities:
    - field: operation
      issue: >
        Real tomography includes forward modeling, residual calculation,
        inversion, regularization, and repeated model adjustment. The
        extraction treats these as subordinate steps of one inverse
        measurement operation rather than separate instruments.
      alternatives:
        - "Keep one inverse-imaging instrument"
        - "Split propagation measurement from inversion/model reconstruction"
  extraction_failures: []
  notes: >
    Proposed schema relevance: none. The apparent complexity is currently a
    granularity question, not evidence that the five-field schema lacks an
    operational relationship.

instrument:
  state: >
    An internal structure cannot be sampled directly, but variations within it
    systematically alter the propagation of signals that cross it along many
    paths.

  operation: >
    Measure signal travel behavior across many source-to-receiver paths,
    compare those observations with predictions from a candidate internal
    model, and iteratively adjust the model to reduce the discrepancies.

  signal: >
    The observed propagation times or waveforms differ from model predictions
    in spatially structured ways across the sampled paths.

  inference: >
    The pattern of discrepancies constrains a spatial model of internal
    properties that could have produced the observed propagation behavior.

  limit: >
    Sparse or uneven path coverage, measurement error, uncertain source
    locations, regularization choices, model assumptions, and non-uniqueness
    can create artifacts or allow multiple internal structures to fit the
    observations.
