extraction:
  id: INTELLIGENCE-SOURCE-CORROBORATION-001
  name: Source corroboration
  practice: Intelligence analysis
  source: >
    Office of the Director of National Intelligence, ICD 203 Analytic
    Standards; https://www.dni.gov/files/documents/ICD/ICD-203.pdf
    U.S. Department of State briefing on open-source verification and
    cross-corroboration;
    https://2021-2025.state.gov/briefings-foreign-press-centers/russian-attacks-targeting-ukraine-energy-infrastructure
  status: accepted
  ambiguities:
    - field: signal
      issue: >
        Agreement counts as meaningful corroboration only to the degree that
        the sources are genuinely independent and credible; apparent
        convergence can otherwise be duplicated reporting from one origin.
      alternatives:
        - "Independent convergence or contradiction"
        - "Weighted convergence after source-dependence assessment"
  extraction_failures: []
  notes: >
    Proposed schema relevance: none. This deliberately tests a nonphysical,
    relational signal.

instrument:
  state: >
    A claim or event description is supported by one or more information
    sources whose accuracy, independence, or access may be uncertain.

  operation: >
    Compare the claim against other independently sourced information while
    assessing each source's credibility, access, dependence, and relevance.

  signal: >
    Independent sources converge on, contradict, or fail to support the same
    material features of the claim.

  inference: >
    Genuine convergence across credible independent sources increases support
    for the corroborated features, while contradiction or lack of independent
    support lowers confidence or identifies unresolved uncertainty.

  limit: >
    Sources may share an undisclosed common origin, copy one another, inherit
    the same bias or error, have unequal access, or converge because of common
    assumptions rather than independent observation. Multiple reports therefore
    do not automatically constitute independent evidence.
