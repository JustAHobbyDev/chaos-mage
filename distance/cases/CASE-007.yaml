case_id: CASE-007
source:
  name: Chain-of-custody verification
  practice: Forensic investigation
  instrument:
    state: 'An item or record passes through multiple handlers or locations, creating opportunities
      for substitution, alteration, contamination, or uncertainty about identity.

      '
    operation: 'Record each transfer and handling event with the responsible party, time, and purpose,
      then inspect that history for continuity and unexplained transitions.

      '
    signal: 'A continuous, internally consistent handling record links the examined item through
      its lifecycle, while gaps or contradictions identify breaks in documented custody.

      '
    inference: 'Documentary continuity supports the claim that the item examined is the item collected
      and that its handling history is accounted for; gaps weaken that provenance claim.

      '
    limit: 'Complete documentation does not itself prove that handlers recorded events truthfully
      or that no unrecorded alteration occurred, and missing records do not prove that alteration
      occurred. The strength of the inference depends on the reliability of the recording and safeguarding
      process.

      '
target:
  domain: Data lineage and document workflow
  problem: A report passes through multiple editors and data transformations. Audit whether the final
    report can be connected to the original inputs and whether undocumented alterations or transfers
    occurred.
