case_id: CASE-012
source:
  name: Seismic tomography
  practice: Seismology and geophysics
  instrument:
    state: 'An internal structure cannot be sampled directly, but variations within it systematically
      alter the propagation of signals that cross it along many paths.

      '
    operation: 'Measure signal travel behavior across many source-to-receiver paths, compare those
      observations with predictions from a candidate internal model, and iteratively adjust the model
      to reduce the discrepancies.

      '
    signal: 'The observed propagation times or waveforms differ from model predictions in spatially
      structured ways across the sampled paths.

      '
    inference: 'The pattern of discrepancies constrains a spatial model of internal properties that
      could have produced the observed propagation behavior.

      '
    limit: 'Sparse or uneven path coverage, measurement error, uncertain source locations, regularization
      choices, model assumptions, and non-uniqueness can create artifacts or allow multiple internal
      structures to fit the observations.

      '
target:
  domain: Organizational hidden-structure inference
  problem: An analyst has timestamps for requests and replies passing between teams, partial route
    records, and a formal organization chart. Infer hidden coordination bottlenecks and dependencies
    without directly observing all internal interactions.
