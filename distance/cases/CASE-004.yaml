case_id: CASE-004
source:
  name: Serial monitoring
  practice: Clinical diagnosis
  instrument:
    state: 'The underlying process may change over time, and a single observation cannot adequately
      distinguish stable state, transient fluctuation, or directional change.

      '
    operation: 'Repeat a comparable measurement or observation at multiple time points and evaluate
      the resulting sequence against expected variation or a defined change rule.

      '
    signal: 'The sequence exhibits persistence, trend, reversal, threshold crossing, or another temporal
      pattern not available from an isolated measurement.

      '
    inference: 'The temporal pattern constrains hypotheses about whether and how the underlying state
      is changing and can distinguish sustained change from some forms of transient variation.

      '
    limit: 'Measurement error, regression to the mean, irregular sampling, changing measurement conditions,
      interventions between observations, and poorly chosen intervals or thresholds can create or
      conceal apparent trends.

      '
target:
  domain: Operations monitoring
  problem: An operations team observes repeated service latency and error measurements during ordinary
    workload variation. Determine whether service behavior is persistently degrading or briefly fluctuating.
