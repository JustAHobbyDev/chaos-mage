case_id: CASE-018
source:
  name: Differential diagnosis
  practice: Clinical diagnosis
  instrument:
    state: 'A set of observations can plausibly be explained by more than one underlying mechanism
      or condition.

      '
    operation: 'Generate multiple candidate explanations, gather or inspect evidence that bears differently
      on them, and repeatedly revise their relative plausibility as evidence accumulates.

      '
    signal: 'New observations create a pattern of support, contradiction, or non-discrimination across
      the competing explanations.

      '
    inference: 'Explanations can be reprioritized, eliminated, or retained, narrowing the plausible
      set without requiring an early commitment to a single cause.

      '
    limit: 'The result is constrained by which hypotheses were generated, the quality and independence
      of the evidence, test sensitivity and specificity, and susceptibility to anchoring, premature
      closure, base-rate neglect, or confirmation bias.

      '
target:
  domain: Literary and textual analysis
  problem: A critic studies an anonymous novel with repeated images, stylistic discontinuities, and
    possible revisions. Only the final text and limited publication context survive. Explain the
    textual organization and what, if anything, supports claims about its formation.
