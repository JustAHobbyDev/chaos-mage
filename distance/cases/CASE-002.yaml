case_id: CASE-002
source:
  name: Source corroboration
  practice: Intelligence analysis
  instrument:
    state: 'A claim or event description is supported by one or more information sources whose accuracy,
      independence, or access may be uncertain.

      '
    operation: 'Compare the claim against other independently sourced information while assessing
      each source''s credibility, access, dependence, and relevance.

      '
    signal: 'Independent sources converge on, contradict, or fail to support the same material features
      of the claim.

      '
    inference: 'Genuine convergence across credible independent sources increases support for the
      corroborated features, while contradiction or lack of independent support lowers confidence
      or identifies unresolved uncertainty.

      '
    limit: 'Sources may share an undisclosed common origin, copy one another, inherit the same bias
      or error, have unequal access, or converge because of common assumptions rather than independent
      observation. Multiple reports therefore do not automatically constitute independent evidence.

      '
target:
  domain: Investigative journalism
  problem: Several witnesses and documents make conflicting claims about who authorized a public
    project. Establish which claims have independent support and which remain uncertain.
