case_id: CASE-011
source:
  name: Chromatography
  practice: Analytical chemistry
  instrument:
    state: 'A sample contains multiple components whose interactions with two phases differ enough
      that those components need not move together.

      '
    operation: 'Carry the sample through a system containing a moving phase and a stationary phase
      so that components repeatedly partition between them.

      '
    signal: 'Components migrate at different rates and emerge at different positions or times, producing
      separated bands or detector peaks.

      '
    inference: 'The separation pattern supports the presence of distinguishable components with different
      partition behavior and permits their relative retention to be characterized.

      '
    limit: 'Components with similar partition behavior may co-elute, operating conditions can shift
      retention, detector response may be nonspecific, and retention behavior alone generally does
      not establish chemical identity without appropriate standards or orthogonal evidence.

      '
target:
  domain: Idea decomposition
  problem: A workshop has produced a collection of proposals combining technical, social, and commercial
    assumptions. An analyst wants to distinguish recurring strands and their interdependence using
    the proposal texts and follow-up discussion.
