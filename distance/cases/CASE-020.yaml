case_id: CASE-020
source:
  name: Dendrochronological crossdating
  practice: Dendrochronology and paleoclimate
  instrument:
    state: 'Multiple sequential records were formed over overlapping periods under partly shared
      external influences, but one or more records have uncertain calendar placement or may contain
      missing or anomalous increments.

      '
    operation: 'Compare the ordered pattern of increments across independently dated or overlapping
      records and shift their relative alignment until distinctive multi-year patterns correspond
      consistently across specimens.

      '
    signal: 'A particular alignment produces repeated matching temporal patterns across records and
      exposes otherwise inconsistent missing, extra, or misassigned increments.

      '
    inference: 'The matching alignment supports assigning specific temporal positions to previously
      uncertain increments and extending or checking the chronology across overlapping records.

      '
    limit: 'Local growth disturbances, weak shared environmental signal, short or repetitive patterns,
      measurement error, incorrect reference chronologies, and insufficient overlap can produce ambiguous
      or false alignments.

      '
target:
  domain: Software regression debugging
  problem: A service began returning incorrect results after a series of commits. Engineers have
    revision history, reproducible test inputs, application logs, and some incomplete traces. Determine
    where the behavior changed and which explanations remain plausible.
