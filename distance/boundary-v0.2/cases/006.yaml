case_id: '006'
source:
  name: Dechallenge and rechallenge
  practice: Clinical diagnosis
  instrument:
    state: 'A suspected factor is present while an effect is occurring, and the factor can potentially
      be removed and, in some circumstances, reintroduced.

      '
    operation: 'Remove the suspected factor and observe whether the effect changes; where justified
      and safe, reintroduce the factor and observe whether the effect returns.

      '
    signal: 'The effect diminishes after removal and may recur after reintroduction in temporal
      association with the perturbation.

      '
    inference: 'A reproducible relationship between removing or restoring the factor and disappearance
      or recurrence of the effect increases support for a causal contribution by that factor.

      '
    limit: 'Effects may resolve or recur spontaneously, concurrent changes may be responsible,
      delayed or persistent effects can obscure the response, and reintroduction may be unsafe
      or impossible. Temporal response alone does not exclude alternative causes.

      '
target:
  domain: Literary interpretation and reader studies
  problem: 'A critic investigates which features of a passage contribute to a specified interpretation:
    that its narrator is withholding knowledge. Original passages, versions with selected material
    omitted, blinded reader responses to each version, and responses after restoration of omitted
    material are available. Investigate contributors to the specified interpretation.'
