case_id: '015'
source:
  name: Luminol latent-trace detection
  practice: Forensic investigation
  instrument:
    state: 'Material associated with a past event may persist as a latent residue that ordinary
      visual inspection does not reveal.

      '
    operation: 'Apply a probe whose reaction is promoted by material associated with the suspected
      residue.

      '
    signal: 'Responsive material produces an otherwise absent, localized observable reaction.

      '
    inference: 'The reaction supports the presence and location of material capable of producing
      that response.

      '
    limit: 'Unrelated substances may produce the same response, relevant residue may fail to respond
      because it was removed, degraded, or is below detection, and detecting responsive material
      does not by itself establish the event that produced it. The probe may also alter material
      needed for later analysis.

      '
target:
  domain: Strategic assumptions
  problem: A leadership team investigates which persistent strategic assumptions shape its decisions.
    Prospective aspirations and scenario responses are available, without established historical
    residues of prior decisions or commitments. Identify the assumptions and what evidence supports
    claims that they persist.
