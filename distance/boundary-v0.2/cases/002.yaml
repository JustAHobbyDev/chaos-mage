case_id: '002'
source:
  name: Step-response probing
  practice: Control and systems engineering
  instrument:
    state: 'A dynamic system accepts a controlled change in an input and exposes an output whose
      evolution through time can be observed.

      '
    operation: 'Apply a known step change to the input and record the output trajectory from its
      initial state through the transient response toward its later behavior.

      '
    signal: 'The output trajectory exhibits measurable temporal features such as delay, rise,
      overshoot, oscillation, peak, settling, and steady-state change.

      '
    inference: 'Those response features constrain empirical properties of the system''s dynamics
      and can distinguish candidate models or characterize how the system reacts to perturbation.

      '
    limit: 'Noise, unknown initial state, saturation, nonlinear behavior, disturbances, interacting
      inputs, insufficient observation time, and dependence on the chosen operating point can
      distort the response or make conclusions fail to generalize beyond the tested perturbation.

      '
target:
  domain: Museum interpretation
  problem: A museum studies how visitors interpret an exhibition as a visit unfolds. An entrance
    panel changes between observation periods while the rest of the exhibition remains the same.
    Visitor routes, pauses, and interview evidence are recorded through each visit before and
    after the panel change. Investigate how interpretation changes through a visit.
