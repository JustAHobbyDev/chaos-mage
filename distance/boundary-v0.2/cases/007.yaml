case_id: '007'
source:
  name: Delta debugging
  practice: Software debugging and testing
  instrument:
    state: 'A reproducible failure occurs for a configuration or input composed of multiple removable
      parts, and candidate reductions can be repeatedly tested.

      '
    operation: 'Partition the failure-inducing configuration, remove subsets or test their complements,
      and iteratively retain reductions that continue to reproduce the defined failure.

      '
    signal: 'Some reduced configurations preserve the failure while others do not, revealing which
      removals are compatible with continued reproduction.

      '
    inference: 'The procedure narrows the configuration to a test-relative minimal or near-minimal
      failure-inducing subset or difference whose retained parts are sufficient to reproduce the
      observed failure under the test.

      '
    limit: 'Interactions among parts, nondeterministic failures, unresolved test outcomes, environmental
      dependence, and the reduction strategy can prevent strong minimization. A retained minimal
      configuration demonstrates reproducibility under the test, not necessarily the unique underlying
      causal mechanism.

      '
target:
  domain: Literary interpretation and reader studies
  problem: 'A critic investigates which features of a passage contribute to a specified interpretation:
    that its narrator is withholding knowledge. Original passages, versions with selected material
    omitted, blinded reader responses to each version, and responses after restoration of omitted
    material are available. Investigate contributors to the specified interpretation.'
