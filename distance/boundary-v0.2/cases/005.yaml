case_id: '005'
source:
  name: Provenance reconstruction
  practice: Archival and provenance research
  instrument:
    state: 'An object''s history is only partially known, but dispersed records may preserve dated
      traces of ownership, custody, transfer, location, or transaction.

      '
    operation: 'Gather and cross-check records that can link the object to successive people,
      places, and transactions, arranging supported links into a chronology and marking unsupported
      intervals as gaps.

      '
    signal: 'Independent records form compatible chronological links between successive states
      of ownership or custody, while contradictions and missing intervals expose uncertainty in
      the reconstructed sequence.

      '
    inference: 'The compatible links support a bounded reconstruction of the object''s documented
      history, including which transitions are established and where provenance remains unresolved.

      '
    limit: 'Records may be lost, inaccessible, anonymous, forged, mistaken, or copied from one
      another; names and descriptions may be ambiguous; absence of a record does not establish
      absence of a transfer; and a continuous-looking chronology can still contain undocumented
      or misidentified transitions.

      '
target:
  domain: Literary and textual analysis
  problem: A critic studies an anonymous novel with repeated images, stylistic discontinuities,
    and possible revisions. The final text, limited publication context, dated draft fragments,
    and publication correspondence survive. Explain the textual organization and what, if anything,
    supports claims about its formation.
