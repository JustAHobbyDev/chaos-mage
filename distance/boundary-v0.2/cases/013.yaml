case_id: '013'
source:
  name: Chromatography
  practice: Analytical chemistry
  instrument:
    state: 'A sample contains multiple components whose interactions with two phases differ enough
      that those components need not move together.

      '
    operation: 'Carry the sample through a system containing a moving phase and a stationary phase
      so that components repeatedly partition between them.

      '
    signal: 'Components migrate at different rates and emerge at different positions or times,
      producing separated bands or detector peaks.

      '
    inference: 'The separation pattern supports the presence of distinguishable components with
      different partition behavior and permits their relative retention to be characterized.

      '
    limit: 'Components with similar partition behavior may co-elute, operating conditions can
      shift retention, detector response may be nonspecific, and retention behavior alone generally
      does not establish chemical identity without appropriate standards or orthogonal evidence.

      '
target:
  domain: Idea decomposition
  problem: A team studies a proposal composed of interwoven idea fragments. The evidence consists
    of proposal texts and free-form discussion, without an established circulation, retention,
    and release workflow. Determine which components can be distinguished and what evidence supports
    that decomposition.
