  finding_status: Possible shared confound; not an established error
  review: Both runs explicitly construct retention/release protocols and admit they might create rather
    than reveal component patterns. Their Remote labels depend on accepting these constructions as coherent.
    Distinguish counterpart grounding from inventiveness or practical difficulty; do not automatically
    upgrade to Alien.
  evidence:
  - ../judgments/CASE-011-A.json
  - ../judgments/CASE-011-B.json
  - ../judgments/CASE-014-A.json
  - ../judgments/CASE-014-B.json
not_observed: No explicit different-disciplines-therefore-high shortcut, semantic-distance score, vocabulary-only
