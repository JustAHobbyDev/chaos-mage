version: "0.1"
status: seed-candidate-catalogue
purpose: >
  A deliberately heterogeneous starting set of practices and candidate
  instruments. Entries here are candidates only. They become catalogue
  instruments only after independent extraction under the frozen v0.1 schema.

selection_principle: >
  Prefer diversity of epistemic operation over diversity of academic labels.
  The seed set should include revealing latent traces, reconstructing history,
  indirect inference of hidden structure, perturbation, separation, sampling,
  comparison of competing explanations, adversarial probing, lineage tracing,
  and failure decomposition.

